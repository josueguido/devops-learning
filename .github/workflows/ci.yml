name: CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "projects/01-docker-cicd/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker-build.yml"
  push:
    branches: ["main"]
    paths:
      - "projects/01-docker-cicd/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker-build.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/01-docker-cicd/backend/requirements.txt

      - name: Install dependencies and linter
        run: python -m pip install -r projects/01-docker-cicd/backend/requirements.txt ruff

      - name: Lint Python
        run: ruff check projects/01-docker-cicd/backend projects/01-docker-cicd/tests

      - name: Test API
        run: python -m pytest projects/01-docker-cicd/tests
        env:
          PYTHONPATH: projects/01-docker-cicd/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        run: node --check projects/01-docker-cicd/frontend/app.js
