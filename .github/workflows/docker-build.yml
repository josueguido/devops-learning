name: Docker Build and Scan

on:
  pull_request:
    branches: ["main"]
    paths:
      - "projects/01-docker-cicd/backend/**"
      - "projects/01-docker-cicd/frontend/**"
      - "projects/01-docker-cicd/database/**"
      - "projects/01-docker-cicd/docker-compose*.yml"
      - ".github/workflows/docker-build.yml"
  push:
    branches: ["main"]
    paths:
      - "projects/01-docker-cicd/backend/**"
      - "projects/01-docker-cicd/frontend/**"
      - "projects/01-docker-cicd/database/**"
      - "projects/01-docker-cicd/docker-compose*.yml"
      - ".github/workflows/docker-build.yml"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  security-events: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Build frontend (no push)
        uses: docker/build-push-action@v7
        with:
          load: true
          context: ./projects/01-docker-cicd/frontend
          file: ./projects/01-docker-cicd/frontend/Dockerfile
          push: false
          tags: app-01-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend (no push)
        uses: docker/build-push-action@v7
        with:
          load: true
          context: ./projects/01-docker-cicd/backend
          file: ./projects/01-docker-cicd/backend/Dockerfile
          push: false
          tags: app-01-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: app-01-backend:ci
          format: sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          output: trivy-backend.sarif

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: app-01-frontend:ci
          format: sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          output: trivy-frontend.sarif

      - name: Upload backend Trivy results
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload frontend Trivy results
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
