<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DevOps Learning — tareas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">Proyecto 1 · Aplicación de práctica</p>
        <h1>DevOps Learning</h1>
        <p class="intro">Una aplicación sencilla para practicar el ciclo de entrega.</p>
      </header>

      <section class="panel" aria-labelledby="status-heading">
        <h2 id="status-heading">Estado de los servicios</h2>
        <p id="status" role="status">Comprobando la API y PostgreSQL…</p>
      </section>

      <section class="panel" aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Tareas</h2>
        <form id="task-form">
          <label for="title">Nueva tarea</label>
          <div class="form-row">
            <input id="title" name="title" maxlength="120" required>
            <button type="submit">Agregar</button>
          </div>
        </form>
        <p id="message" role="status"></p>
        <ul id="tasks" aria-live="polite"></ul>
      </section>
    </main>
  </body>
</html>
